[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faf-carga"
version = "0.1.0"
description = "Carga da API de dados abertos Transferências Fundo a Fundo (Transferegov) no PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[project.scripts]
faf-carga = "faf_carga.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integracao'"
markers = ["integracao: usa rede e/ou banco reais"]
